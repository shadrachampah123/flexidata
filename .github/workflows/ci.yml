name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, and DB-free verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flexiData

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flexiData/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (fake CI-only database URL; no connection is made)
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci_build:ci_build@127.0.0.1:5432/flexidata_build_only

      - name: Verify schema compatibility (5 simulated schema scenarios)
        run: npm run verify:schema-compat

      - name: Verify registration seed resilience (6 simulated schema scenarios)
        run: npm run verify:seed-resilience

      - name: Verify production security fixes (in-memory simulator and local stub)
        run: npm run verify:security-fixes

      - name: Verify production data-provider lock and health safety (in-memory, network-free)
        run: npm run verify:data-provider-safety

      - name: Verify health recovery guidance and response compatibility (DB-free)
        run: npm run verify:health-recovery

      - name: Verify restore-plan preflight refusal and metadata gates (DB-free, no restore path)
        run: npm run verify:restore-plan-preflight

      - name: Verify Reloadly sandbox contract and activation lock (network-free)
        run: npm run verify:reloadly

      - name: Verify Techlink contract boundary and mocked lifecycle rules (network-free)
        run: npm run verify:techlink

      - name: Verify Part 6.4 go/no-go automation (provider lock, schema agreement, migration audit; network-free)
        run: npm run verify:production-readiness

      - name: Verify auth recovery and signup flow (in-memory simulator)
        run: npm run verify:auth-flow

      - name: Verify admin authorization (in-memory simulator)
        run: npm run verify:admin-access

      - name: "Verify admin read-only dashboard (DB-free: masking, guards, source-level, financial invariants)"
        run: npm run verify:admin-phase1

      - name: "Verify admin customer management (DB-free: suspend/activate source guarantees)"
        run: npm run verify:admin-phase2

      - name: "Verify admin support workflow (DB-free: eligibility, write-surface, migration guarantees)"
        run: npm run verify:admin-support

      - name: "Verify admin investigation & accountability (DB-free: diagnosis engine, source guarantees)"
        run: npm run verify:admin-ops

      - name: "Verify safe admin Phase 3-6 boundaries (DB-free: request, audit, support race, kill switch)"
        run: npm run verify:admin-phase3-6

      - name: Verify withdrawals remain disabled (DB-free phase)
        run: npm run verify:withdrawals-disabled

      - name: Verify withdrawal lifecycle rules (DB-free phase)
        run: npm run verify:withdrawal-lifecycle

      - name: "Verify withdrawal security and accounting invariants (DB-free phase: F1-F8, W1-W4)"
        run: npm run verify:withdrawal-security

      - name: Verify payout safety invariants and migration ordering (DB-free, network-free phase)
        run: npm run verify:phase-b

      - name: Verify payout reconciliation is detection-only and read-only (DB-free phase)
        run: npm run verify:payout-reconciliation

      - name: Verify demo-deposit cleanup safety (in-memory simulator)
        run: npm run verify:demo-deposit-cleanup

      - name: Integration suites not run in this DB-free job
        if: always()
        run: |
          echo "Not run here: database and live-app phases (schema baseline, signup DB checks, withdrawal API/database drives, payout execution and reconciliation against a database and app server, Paystack E2E)."
          echo "The withdrawal-security, payout safety (phase B) and payout-reconciliation suites run only their DB-free Phase A here; their database and live-app phases are not represented as passing by this workflow."
          echo "Real-PostgreSQL purchase and migration suites run in their own jobs."

  migration-postgres:
    name: Guarded purchase_attempts migration (real PostgreSQL, disposable database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flexiData
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: purchase_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d purchase_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flexiData/package-lock.json
      - run: npm ci
      - name: Verify guarded applier, drift refusal, constraint probes and recovery guard
        run: npm run verify:purchase-attempts-migration
        env:
          PURCHASE_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/purchase_lifecycle_test
          DRIZZLE_ALLOW_LOCAL_DB: '1'

  purchase-postgres:
    name: Durable purchase lifecycle (real PostgreSQL, synthetic provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flexiData
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: purchase_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d purchase_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flexiData/package-lock.json
      - run: npm ci
      - name: Verify actual migration, concurrency, rollback and reconciliation
        run: npm run verify:purchase-lifecycle
        env:
          PURCHASE_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/purchase_lifecycle_test
          DRIZZLE_ALLOW_LOCAL_DB: '1'
